spring.application.name=biblioteca-graphql

# Endpoint único da API (padrão do Spring for GraphQL)
spring.graphql.http.path=/graphql

# Interface GraphiQL em http://localhost:8080/graphiql
spring.graphql.graphiql.enabled=true

# Mostra o schema em texto em http://localhost:8080/graphql/schema
spring.graphql.schema.printer.enabled=true
